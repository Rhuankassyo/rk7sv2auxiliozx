<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RK7S V2</title>
  
  <!-- Configurações do PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030000">
  <!-- Ícone para iOS (iPhone/iPad) -->
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas de partículas */
    #particle-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(180, 10, 10, 0.1) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
    }

    /* ===== TELA DE LOGIN ===== */
    .login-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 350px;
      padding: 2rem 1.5rem;
      background: rgba(15, 0, 0, 0.85);
      border-radius: 16px;
      border: 1px solid rgba(255, 40, 40, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      text-shadow: 0 0 12px rgba(255, 40, 40, 0.5);
    }

    .login-input {
      width: 100%;
      padding: 0.9rem;
      background: rgba(30, 0, 0, 0.5);
      border: 1px solid rgba(255, 40, 40, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      text-align: center;
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: #ff1010;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 16, 16, 0.3);
    }

    .login-error {
      color: #ff4040;
      font-size: 0.8rem;
      text-align: center;
      display: none;
    }

    /* ===== MENU PRINCIPAL ===== */
    .main-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      z-index: 10;
      position: relative;
      width: 100%;
      padding: 0 1rem;
    }

    .main-wrapper.active {
      display: flex;
    }

    .menu-container {
      width: 100%;
      max-width: 360px;
      padding: 1.5rem 1.2rem;
      background: rgba(15, 0, 0, 0.85);
      border-radius: 16px;
      border: 1px solid rgba(255, 40, 40, 0.15);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .menu-title { font-size: 1.4rem; font-weight: 700; color: #ffffff; text-align: center; }
    .menu-title span { color: #ff2020; font-size: 0.9rem; margin-left: 4px; }

    .tab-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-name { color: #777; font-size: 0.9rem; font-weight: 600; cursor: pointer; padding: 0.5rem 0 0.8rem 0; position: relative; }
    .tab-name.active { color: #ffffff; }
    .tab-name.active::after {
      content: ''; position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px;
      background: #ff1010; box-shadow: 0 0 8px rgba(255, 16, 16, 0.8);
    }

    .tab-panel { display: none; flex-direction: column; gap: 0.9rem; }
    .tab-panel.active { display: flex; }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem; border-radius: 10px; background: rgba(40, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer;
    }
    .toggle-row.active { background: rgba(80, 0, 0, 0.4); }
    .toggle-label { color: #eee; font-size: 0.85rem; font-weight: 500; }

    .switch {
      width: 42px; height: 22px; background: #2a0000; border-radius: 20px; position: relative; transition: 0.3s;
    }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
      border-radius: 50%; background: #555; transition: 0.3s;
    }
    .toggle-row.active .switch { background: #ff1010; }
    .toggle-row.active .switch::after { transform: translateX(20px); background: #fff; }

    .slider-container { background: rgba(40, 0, 0, 0.3); border-radius: 10px; padding: 1rem; border: 1px solid rgba(255, 255, 255, 0.04); }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: #ccc; margin-bottom: 0.8rem; }
    .slider-header .value { color: #ff2020; font-size: 1rem; }

    input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #2a0000; border-radius: 4px; outline: none; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: #ff1010; border: 2px solid #ff5050; box-shadow: 0 0 10px rgba(255, 16, 16, 0.8);
    }

    .file-upload-box {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem; border-radius: 10px; background: rgba(40, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer;
    }
    .file-btn { padding: 0.4rem 0.8rem; background: rgba(255, 32, 32, 0.15); border: 1px solid rgba(255, 32, 32, 0.3); color: #ff4040; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }

    .start-btn {
      width: 100%; max-width: 360px; padding: 1rem; border: none; border-radius: 10px;
      background: #ff1010; color: #ffffff; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 15px rgba(255, 16, 16, 0.4);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <canvas id="particle-canvas"></canvas>

  <!-- TELA DE LOGIN -->
  <div class="login-container" id="loginScreen">
    <div class="login-title">RK7S V2</div>
    <input type="text" class="login-input" id="keyInput" placeholder="Insira sua Key" autocomplete="off">
    <div class="login-error" id="loginError">Key inválida ou expirada.</div>
    <button class="login-btn" id="loginBtn">Acessar</button>
  </div>

  <!-- MENU PRINCIPAL -->
  <div class="main-wrapper" id="mainWrapper">
    <div class="menu-container">
      <div class="menu-title">RK7S <span>V2</span></div>

      <div class="tab-bar">
        <span class="tab-name active" data-tab="funcoes">Precisão</span>
        <span class="tab-name" data-tab="otimizacoes">Otimização</span>
      </div>

      <div class="tab-panel active" id="funcoes">
        <div class="toggle-row" id="toggleAimbot">
          <span class="toggle-label">Aumentar precisão</span>
          <div class="switch"></div>
        </div>
        <div class="toggle-row" id="toggleTremida">
          <span class="toggle-label">Reduzir tremedeira</span>
          <div class="switch"></div>
        </div>
        <div class="slider-container">
          <div class="slider-header">
            <span>Precisão</span>
            <span class="value" id="fovValue">0</span>
          </div>
          <input type="range" min="0" max="10" value="0" step="1" id="fovSlider">
        </div>
      </div>

      <div class="tab-panel" id="otimizacoes">
        <div class="toggle-row" id="toggleFps">
          <span class="toggle-label">Aumentar FPS</span>
          <div class="switch"></div>
        </div>
        <div class="toggle-row" id="toggleLatencia">
          <span class="toggle-label">Reduzir Latência</span>
          <div class="switch"></div>
        </div>
        <div class="file-upload-box" id="fileBox">
          <span class="toggle-label" id="fileLabel" style="color: #888; font-size: 0.8rem;">Nenhum arquivo</span>
          <span class="file-btn" id="fileBtn">Selecionar</span>
        </div>
        <input type="file" id="fileInput" accept=".js,.txt,.json" style="display:none;">
      </div>
    </div>

    <button class="start-btn" id="startBtn">Iniciar Jogo</button>
  </div>

  <!-- FIREBASE (LOGIN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2vQuHXH6hzBg4MjWMNK2h4V_QFbfNfsw",
      authDomain: "v2rk7s.firebaseapp.com",
      projectId: "v2rk7s",
      storageBucket: "v2rk7s.firebasestorage.app",
      messagingSenderId: "419290874951",
      appId: "1:419290874951:web:a87d9b1d308c07eee71d62",
      measurementId: "G-7BT2EBFM72"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('loginScreen');
    const mainWrapper = document.getElementById('mainWrapper');
    const keyInput = document.getElementById('keyInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    loginBtn.addEventListener('click', async () => {
      const key = keyInput.value.trim();
      if (!key) return;

      loginBtn.textContent = 'Verificando...';
      loginBtn.disabled = true;
      loginError.style.display = 'none';

      try {
        const docRef = doc(db, "keys", key);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists() && docSnap.data().active === true) {
          loginScreen.style.display = 'none';
          mainWrapper.classList.add('active');
        } else {
          loginError.style.display = 'block';
          loginError.textContent = 'Key inválida ou expirada.';
        }
      } catch (error) {
        loginError.style.display = 'block';
        loginError.textContent = 'Erro de conexão.';
      } finally {
        loginBtn.textContent = 'Acessar';
        loginBtn.disabled = false;
      }
    });

    keyInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // Registra o Service Worker para funcionar offline (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          console.log('ServiceWorker registrado:', registration.scope);
        }).catch(error => {
          console.log('Falha no ServiceWorker:', error);
        });
      });
    }
  </script>

  <script>
    // OBJETO GLOBAL
    window.state = {
      aimbot_precisao: false,
      reduzir_tremadeira: false,
      precisao_valor: 0,
      aumentar_fps: false,
      reduzir_latencia: false,
      arquivo_config: null
    };

    // Abas
    const tabNames = document.querySelectorAll('.tab-name');
    const panels = document.querySelectorAll('.tab-panel');
    tabNames.forEach(name => {
      name.addEventListener('click', () => {
        const target = name.dataset.tab;
        tabNames.forEach(n => n.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        name.classList.add('active');
        document.getElementById(target).classList.add('active');
      });
    });

    // Slider
    const slider = document.getElementById('fovSlider');
    const valueDisplay = document.getElementById('fovValue');
    slider.addEventListener('input', () => {
      valueDisplay.textContent = slider.value;
      window.state.precisao_valor = parseInt(slider.value);
    });

    // Toggles
    document.getElementById('toggleAimbot').addEventListener('click', function() {
      this.classList.toggle('active');
      window.state.aimbot_precisao = this.classList.contains('active');
    });
    document.getElementById('toggleTremida').addEventListener('click', function() {
      this.classList.toggle('active');
      window.state.reduzir_tremadeira = this.classList.contains('active');
    });
    document.getElementById('toggleFps').addEventListener('click', function() {
      this.classList.toggle('active');
      window.state.aumentar_fps = this.classList.contains('active');
    });
    document.getElementById('toggleLatencia').addEventListener('click', function() {
      this.classList.toggle('active');
      window.state.reduzir_latencia = this.classList.contains('active');
    });

    // Upload
    const fileBox = document.getElementById('fileBox');
    const fileBtn = document.getElementById('fileBtn');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');

    fileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        window.state.arquivo_config = fileInput.files[0];
        fileLabel.textContent = fileInput.files[0].name;
        fileLabel.style.color = '#fff';
        fileBtn.textContent = 'Ativo';
        fileBtn.style.background = 'rgba(255, 32, 32, 0.4)';
      }
    });

    // DEEPLINK FREE FIRE
    function abrirJogo(packageName) {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;

      if (/android/i.test(userAgent)) {
          window.location.href = `intent://#Intent;package=${packageName};scheme=freefire;end`;
          setTimeout(() => {
              window.location.href = `https://play.google.com/store/apps/details?id=${packageName}`;
          }, 1500);
      } else if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          window.location.href = 'freefire://';
          setTimeout(() => {
              window.location.href = 'https://apps.apple.com/br/app/garena-free-fire/id1018017380';
          }, 1500);
      } else {
          alert("A abertura automática do app funciona apenas no celular.");
      }
    }

    // INICIAR
    document.getElementById('startBtn').addEventListener('click', async () => {
      const btn = document.getElementById('startBtn');
      btn.textContent = 'Iniciando...';
      
      try {
        let scriptParaInjetar = '';
        if (window.state.arquivo_config) {
          scriptParaInjetar = await window.state.arquivo_config.text();
        } else {
          scriptParaInjetar = `console.log("Nenhum arquivo selecionado.");`;
        }

        eval(scriptParaInjetar);
        abrirJogo('com.dts.freefireth'); 

        setTimeout(() => { btn.textContent = 'Iniciar Jogo'; }, 2000);
      } catch (error) {
        console.error("Erro:", error);
        alert("Erro ao executar o arquivo.");
        btn.textContent = 'Iniciar Jogo';
      }
    });

    // Partículas
    (function() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let width, height, particles = [];
      function initCanvas() {
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width; canvas.height = height;
        const count = Math.min(70, Math.max(30, Math.floor((width * height) / 25000)));
        particles = [];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width, y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
            radius: Math.random() * 1.5 + 0.5,
            color: Math.random() > 0.2 ? 'rgba(255, 32, 32, 0.8)' : 'rgba(255, 255, 255, 0.6)'
          });
        }
      }
      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let p of particles) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 6;
          ctx.fill(); ctx.shadowBlur = 0;
        }
        requestAnimationFrame(animate);
      }
      window.addEventListener('resize', initCanvas);
      initCanvas(); animate();
    })();
  </script>
</body>
</html>
